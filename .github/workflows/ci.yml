name: CI

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: make test

  # Builds both images and starts the stack exactly as a reviewer would: `make up`.
  docker-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make up
      - run: curl --fail --silent http://localhost:8000/health
      - run: curl --fail --silent http://localhost:3000/ | grep -q 'id="root"'
      - run: make down
