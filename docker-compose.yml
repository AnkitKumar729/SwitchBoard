# Starts the whole stack: `make up` (or `docker compose up --build`).
# Values come from the .env file next to this file; see .env.example.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:?Set LLM_API_KEYS in the .env file}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.5-flash-lite}
      LLM_API_BASE: ${LLM_API_BASE:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
    volumes:
      - chat-data:/data   # the SQLite file lives here, so history survives container restarts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  chat-data:
